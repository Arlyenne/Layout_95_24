<!DOCTYPE html>
<html>
<head>
    <title> Pengenalan HTML dan CSS </title>
</head>
<body bgcolor="pink">
    <!-- property untuk membuat warna pada background : bgcolor="color"
     property untuk membuat latar belakang/background gambar : background="nama file gambar.jpg/.png"-->
    <!-- body untuk isi web -->
     <!-- tag untuk membuat paragraf : <p>  </p> -->
      <p>ini adalah sebuah paragraf</p>
      <p>ini adalah paragraf kedua</p>
      <p>ini adalah paragraf ketiga</p>
        <u>ini underline</u>
        <i>ini italic</i>
    

        <p><font color="green" size="16"> ini adalah paragraf </font></p>

        <!-- tag untuk membuat judul/heading : <h1> </h1> ... -->
         <h1> ini adalah heading paling besar </h1>
         <h2> ini adalah heading sedang </h2>
         <h6> ini adalah heading paling kecil </h6>

        <!-- memberikan font -->
         <p><font type="Arial" size="12" color="blue">Pengenalan HTML dan CSS</font></p>
</body>
</html>
