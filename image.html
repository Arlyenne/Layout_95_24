<!DOCTYPE html>
<html>
    <head>
        <title>Image HTML dan CSS</title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <!-- Cara menambahkan Gambar dengan ukuran normal -->
         <p class="a">Ini adalah Gambar dengan ukuran normal</p>
         <img src="toothless.jpeg" alt="Toothless">

         <!-- Cara mengubah ukuran pada gambar -->
          <p class="b">Ini adalah Gambar yang sudah diberi ukuran</p>
          <img src="toothless.jpeg" alt="Toothless" class="ukuran">

          <!-- Cara memberikan lengkungan pada Gambar -->
           <p class="c">Ini adalah Gambar yang diberi lengkungan</p>
           <img src="toothless.jpeg" alt="Toothless" class="lengkungan">

           <!-- Cara menggabungkan gambar dan teks -->
            <div class="kelompok">
                <img src="toothless.jpeg" alt="Toothless">
                <p class="d">Gambar Toothless</p>
            </div>
            <!-- Cara memberi efek Hover-->
            <div class="efek">
                <img src="toothless.jpeg" alt="Toothless">
                <p class="e">Ini contoh Hover</p>
            </div>

            <!-- Ini Font External, format font: otf/ttf -->
             <p class="external"> Ini Font External </p>
    </body>
</html>
